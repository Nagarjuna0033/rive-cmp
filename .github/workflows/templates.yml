###########################################################################
# COMMON SETUP
###########################################################################

.common_setup:

  before_script:

    - chmod +x gradlew

    # Install Ruby dependencies
    - bundle config set path "$BUNDLE_PATH"
    - bundle install

###########################################################################
# ANDROID SETUP
###########################################################################

.android_setup:

  extends:
    - .common_setup

  before_script:

    - !reference [.common_setup, before_script]

    - export ANDROID_HOME=$HOME/Library/Android/sdk
    - export ANDROID_SDK_ROOT=$ANDROID_HOME

    - export PATH=$PATH:$ANDROID_HOME/platform-tools
    - export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin

    # google-services.json
    - |
      echo "$GCP_SERVICE_JSON_ANDROID" | base64 --decode > android/google-services.json

    # Copy JKS to the location expected by Gradle
    - |
      echo "Preparing signing keystore..."

      mkdir -p "$CI_PROJECT_DIR/signingConfig"

      cp /Users/arjun/signing.jks \
        "$CI_PROJECT_DIR/signingConfig/signing.jks"

      ls -lh "$CI_PROJECT_DIR/signingConfig/signing.jks"
      file "$CI_PROJECT_DIR/signingConfig/signing.jks"

    # Create keystore.properties
    - |
      echo "Creating keystore.properties..."

      cat > "$CI_PROJECT_DIR/keystore.properties" <<EOF
      storePassword=$KEYSTORE_PASSWORD
      keyPassword=$KEY_PASSWORD
      keyAlias=$KEY_ALIAS
      storeFile=$CI_PROJECT_DIR/signingConfig/signing.jks
      EOF

      echo "keystore.properties:"
      cat "$CI_PROJECT_DIR/keystore.properties"

    # Verify keystore
    - |
      echo "Verifying keystore..."

      keytool -list \
        -v \
        -keystore "$CI_PROJECT_DIR/signingConfig/signing.jks" \
        -storepass "$KEYSTORE_PASSWORD"

      echo "Keystore verification successful."

###########################################################################
# IOS SETUP
###########################################################################

.ios_setup:

  extends:
    - .common_setup

  before_script:

    - !reference [.common_setup, before_script]

    - xcodebuild -version

    # Firebase plist

    - |
      echo "$GCP_SERVICE_JSON_IOS" | base64 --decode > ios/GoogleService-Info.plist
      
      # App Store Connect API Key
    - |
      echo "$APP_STORE_CONNECT_API_KEY" | base64 --decode > AuthKey.p8

    # Certificate

    - |
      echo "$IOS_CERTIFICATE_BASE64" \
      | base64 --decode \
      > certificate.p12

    # Provisioning Profile

    - |
      mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

      echo "$IOS_DEV_PROVISIONING_PROFILE_BASE64" \
      | base64 --decode \
      > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

    - |
      PROFILE=~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      echo "Profile Name:"
      security cms -D -i "$PROFILE" | plutil -extract Name raw -

      echo "Profile application-identifier:"
      security cms -D -i "$PROFILE" | plutil -extract Entitlements.application-identifier raw -

    - |
      echo "Preparing Android signing files for KMP Gradle configuration..."

      mkdir -p "$CI_PROJECT_DIR/signingConfig"

      cp /Users/arjun/signing.jks \
        "$CI_PROJECT_DIR/signingConfig/signing.jks"

      cat > "$CI_PROJECT_DIR/keystore.properties" <<EOF
      storePassword=$KEYSTORE_PASSWORD
      keyPassword=$KEY_PASSWORD
      keyAlias=$KEY_ALIAS
      storeFile=$CI_PROJECT_DIR/signingConfig/signing.jks
      EOF
      
      # Keychain
    - |
      # Shell executor reuses the host, so a keychain from a previous job may
      # still exist. Remove it first to keep create-keychain idempotent.
      security delete-keychain build.keychain || true

    # Keychain
    - |
      security create-keychain \
        -p "$KEYCHAIN_PASSWORD" \
        build.keychain
  
      security unlock-keychain \
        -p "$KEYCHAIN_PASSWORD" \
        build.keychain
  
      security list-keychains -d user -s \
        build.keychain \
        login.keychain-db
  
      security set-keychain-settings -lut 21600 build.keychain
  
      security import certificate.p12 \
        -k build.keychain \
        -P "$IOS_CERTIFICATE_PASSWORD" \
        -T /usr/bin/codesign
  
      security set-key-partition-list \
        -S apple-tool:,apple:,codesign:,security: \
        -s \
        -k "$KEYCHAIN_PASSWORD" \
        build.keychain

    # Apple WWDR intermediate — the signing chain won't validate without it,
    # which makes every identity show as "0 valid identities found".
    - |
      curl -fsSL -o AppleWWDRCAG3.cer \
        https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
      security import AppleWWDRCAG3.cer -k build.keychain || true

    # Fail fast if there is no usable signing identity (e.g. expired cert),
    # instead of running a ~45 min archive that dies at the codesign step.
    - |
      echo "Code-signing identities in build.keychain:"
      security find-identity -v -p codesigning build.keychain

      if security find-identity -v -p codesigning build.keychain \
           | grep -qE "^[[:space:]]*0 valid identities found"; then
        echo "error: no valid code-signing identity found."
        echo "The Apple Development certificate is likely expired or invalid."
        echo "Renew it and update IOS_CERTIFICATE_BASE64 / IOS_CERTIFICATE_PASSWORD"
        echo "and IOS_DEV_PROVISIONING_PROFILE_BASE64 in GitLab CI/CD variables."
        exit 1
      fi


###########################################################################
# ANDROID BUILD TEMPLATE
###########################################################################
.android_build:

  extends:
    - .android_setup

  stage: deploy

  interruptible: false

  tags:
    - macos

  script:
    - |
      echo "======================================"
      echo "Building $BUILD_VARIANT"
      echo "======================================"

      chmod +x gradlew

      ./gradlew \
      $GRADLE_TASK \
      --no-daemon

      ARTIFACT=$(find "$ARTIFACT_DIRECTORY" -type f \( -name "*.apk" -o -name "*.aab" \) | head -1)

      if [ -z "$ARTIFACT" ]; then
        echo "Artifact not found!"
        exit 1
      fi

      export ARTIFACT_PATH="$ARTIFACT"

      echo "ARTIFACT_PATH=$ARTIFACT_PATH"
      ls -lh "$ARTIFACT_PATH"

      if [ "$BUILD_VARIANT" = "ProdRelease" ]; then
        export APK_PATH=$(find android/build/outputs/apk/prod/release -name "*.apk" | head -1)
        export AAB_PATH=$(find android/build/outputs/bundle/prodRelease -name "*.aab" | head -1)

        echo "APK_PATH=$APK_PATH"
        echo "AAB_PATH=$AAB_PATH"
      fi

      echo "$GCP_SERVICE_ACCOUNT_KEY" | base64 --decode > firebase.json
      export GOOGLE_APPLICATION_CREDENTIALS="$PWD/firebase.json"

      bundle exec fastlane "$FASTLANE_LANE"

###########################################################################
# IOS BUILD TEMPLATE
###########################################################################

.ios_build:

  extends:
    - .ios_setup

  stage: deploy

  interruptible: false

  timeout: 2h

  tags:
    - macos

  script:
    - |
      echo "======================================"
      echo "Building iOS $BUILD_VARIANT"
      echo "======================================"

      echo "Current directory:"
      pwd

      echo "Repository root:"
      ls -la

      echo "ios contents:"
      ls -la ios

      echo "Installing CocoaPods..."

      cd ios
      pod install
      cd ..

      echo "Looking for workspaces..."
      find . -name "*.xcworkspace"

      echo "Looking for projects..."
      find . -name "*.xcodeproj"

      echo "Looking for Podfile..."
      find . -name "Podfile"

      echo "FASTLANE_LANE='$FASTLANE_LANE'"

      echo "$GCP_SERVICE_ACCOUNT_KEY" | base64 --decode > firebase.json
      export GOOGLE_APPLICATION_CREDENTIALS="$PWD/firebase.json"

      set -x

      bundle exec fastlane ios "$FASTLANE_LANE" --verbose < /dev/null || {
        echo ""
        echo "========== XCODE BUILD LOG =========="
        find ~/Library/Logs/gym -name "*.log" -exec cat {} \;
        exit 1
      }

  artifacts:
    expire_in: 7 days

    paths:
      - ios/build/