name: Firebase Distribution

on:
  workflow_dispatch:
    inputs:
      androidVariant:
        type: choice
        options:
          - Debug
          - Release
          - Benchmark

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Configure
        run: |
          echo "FIREBASE_APP_ID=${{ secrets.FIREBASE_ANDROID_APP_ID }}" >> $GITHUB_ENV

          case "${{ github.event.inputs.androidVariant }}" in

          Debug)
          echo "GRADLE_TASK=composeApp:assembleDebug" >> $GITHUB_ENV
          echo "TESTER_GROUP=developers" >> $GITHUB_ENV
          ;;
        
          Release)
          echo "GRADLE_TASK=composeApp:assembleRelease" >> $GITHUB_ENV
          echo "TESTER_GROUP=beta" >> $GITHUB_ENV
          ;;
        
          Benchmark)
          echo "GRADLE_TASK=composeApp:assembleBenchmark" >> $GITHUB_ENV
          echo "TESTER_GROUP=qa" >> $GITHUB_ENV
          ;;
          
          esac

      - name: Build APK
        run: ./gradlew $GRADLE_TASK

      - name: Find APK
        id: apk
        run: |
          APK=$(find . -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          echo "Found APK: $APK"
          echo "APK_PATH=$APK" >> $GITHUB_ENV

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ env.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ env.TESTER_GROUP }}
          file: ${{ env.APK_PATH }}
